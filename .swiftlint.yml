disabled_rules:
  - multiple_closures_with_trailing_closure
  - trailing_comma
  - identifier_name

line_length:
  warning: 150
  error: 300
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 20

large_tuple:
  warning: 3
  error: 4

inclusive_language:
  override_allowed_terms:
    - master

excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "CinePlayerApp/CinePlayer.xcodeproj"
